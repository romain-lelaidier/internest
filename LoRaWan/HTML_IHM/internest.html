<!--
HTML server to display the data in real time as it is transfered from the Rasp Pi to the PC
-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Internest</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .header {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: white;
        }
        .content {
            display: flex;
            flex: 1;
            padding: 10px;
            gap: 10px;
        }
        #trajectory {
            flex: 2;
            border: 1px solid #ccc;
            background-color: white;
            position: relative;
        }
        #log {
            flex: 1;
            border: 1px solid #ccc;
            background-color: white;
            overflow-y: auto;
            padding: 10px;
        }
        .controls {
            padding: 10px;
            text-align: center;
            background-color: #ecf0f1;
        }
        button {
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #2980b9;
        }
        .log-entry {
            padding: 5px;
            border-bottom: 1px solid #eee;
        }
        .legend {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 5px;
            font-size: 14px;
            z-index: 100;
            width: 150px;
        }
        .legend-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        .legend-item {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Internest</h1>
        </div>
        <div class="content">
            <div id="trajectory">
                <div class="legend">
                    <div class="legend-title">Legend</div>
                    <div class="legend-item" id="esp-legend"><span style="color: #000000">■</span> esp</div>
                    <div id="id-legend"></div>
                </div>
            </div>
            <div id="log"></div>
        </div>
        <div class="controls">
            <button id="clearBtn">Clear Data</button>
        </div>
    </div>

    <!-- Three.js for 3D visualization -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/OrbitControls.js"></script>

    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / (window.innerHeight * 0.7), 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth * 0.66, window.innerHeight * 0.7);
        document.getElementById('trajectory').appendChild(renderer.domElement);

        // Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        camera.position.set(10, 10, 10);
        controls.update();

        // Axes helper (Cartesian system)
        const axesHelper = new THREE.AxesHelper(10);
        scene.add(axesHelper);

        // Grid helper
        const gridHelper = new THREE.GridHelper(20, 20);
        scene.add(gridHelper);

        // Static points (5 crosses, same color)
        const staticPoints = [
            { x: 0, y: 0, z: 5 },
            { x: 4, y: 3, z: 0 },
            { x: -2, y: 2, z: 0 },
            { x: 2, y: -4, z: 0 },
            { x: -1, y: -2, z: 0 }
        ];

        staticPoints.forEach(point => {
            // Create a cross (two lines)
            const material = new THREE.LineBasicMaterial({ color: 0x000000 });

            // Horizontal line
            const horizontalGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(point.x - 0.2, point.y, point.z),
                new THREE.Vector3(point.x + 0.2, point.y, point.z)
            ]);
            const horizontalLine = new THREE.Line(horizontalGeometry, material);
            scene.add(horizontalLine);

            // Vertical line
            const verticalGeometry = new THREE.BufferGeometry().setFromPoints([
                new THREE.Vector3(point.x, point.y - 0.2, point.z),
                new THREE.Vector3(point.x, point.y + 0.2, point.z)
            ]);
            const verticalLine = new THREE.Line(verticalGeometry, material);
            scene.add(verticalLine);
        });

        // Data storage
        let trajectories = {};
        let colors = {};
        let logEntries = {};
        const colorPalette = [
            0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff,
            0x00ffff, 0xff8800, 0xff0088, 0x8800ff, 0x00ff88
        ];

        // Clear button
        document.getElementById('clearBtn').addEventListener('click', () => {
            clearData();
        });

        // Clear data function
        function clearData() {
            for (const id in trajectories) {
                scene.remove(trajectories[id]);
            }
            trajectories = {};
            colors = {};
            logEntries = {};
            document.getElementById('log').innerHTML = '';
            document.getElementById('id-legend').innerHTML = '';
        }

        function updateLegend() {
            const legendContainer = document.getElementById('id-legend');
            legendContainer.innerHTML = ''; // Clear current legend

            // Get all IDs, sort them
            const sortedIds = Object.keys(colors).map(Number).sort((a, b) => a - b);

            // Rebuild legend in sorted order
            sortedIds.forEach(id => {
                const legendEntry = document.createElement('div');
                legendEntry.className = 'legend-item';
                legendEntry.innerHTML = `<span style="color: #${colors[id].getHexString()}">■</span> ID${id}`;
                legendContainer.appendChild(legendEntry);
    });
}

        // Add data point and connect as a real trajectory
        function addDataPoint(data) {
            const { time, x, y, z, cost, id, confidence, start_time, end_time, birdnet_id } = data;

            // Assign color per ID (ordered palette)
            if (!colors[id]) {
                colors[id] = new THREE.Color(colorPalette[id % colorPalette.length]);
                updateLegend();
            }

            // Create or update trajectory group
            if (!trajectories[id]) {
                trajectories[id] = new THREE.Group();
                scene.add(trajectories[id]);
            }

            // Add point to trajectory
            const geometry = new THREE.SphereGeometry(0.05, 16, 16);
            const material = new THREE.MeshBasicMaterial({ color: colors[id] });
            const sphere = new THREE.Mesh(geometry, material);
            sphere.position.set(x, y, z);
            trajectories[id].add(sphere);

            // Connect all points with lines (real trajectory)
            if (trajectories[id].children.length > 1) {
                // Remove old lines (if any)
                const oldLines = trajectories[id].children.filter(child => child instanceof THREE.Line);
                oldLines.forEach(line => trajectories[id].remove(line));

                // Get all points
                const points = trajectories[id].children
                    .filter(child => child instanceof THREE.Mesh)
                    .map(mesh => mesh.position);

                // Connect all points sequentially
                for (let i = 0; i < points.length - 1; i++) {
                    const lineGeometry = new THREE.BufferGeometry().setFromPoints([points[i], points[i + 1]]);
                    const lineMaterial = new THREE.LineBasicMaterial({ color: colors[id] });
                    const line = new THREE.Line(lineGeometry, lineMaterial);
                    trajectories[id].add(line);
                }
            }

            // Update log entry for this ID (ordered by ID)
            const logEntry = document.getElementById(`log-${id}`);
            if (logEntry) {
                logEntry.innerHTML = ` ${time} : <strong>ID${id} </strong> (${birdnet_id}), ${(start_time / 60).toFixed(0)}:${(start_time % 60).toFixed(0)} to ${(end_time / 60).toFixed(0)}:${(end_time % 60).toFixed(0)}, <br/> Confidence: ${confidence.toFixed(2)}, Cost: ${cost.toFixed(2)}`;
            } else {
                const newLogEntry = document.createElement('div');
                newLogEntry.id = `log-${id}`;
                newLogEntry.className = 'log-entry';
                newLogEntry.innerHTML = ` ${time} : <strong>ID${id} </strong> (${birdnet_id}), ${(start_time / 60).toFixed(0)}:${(start_time % 60).toFixed(0)} to ${(end_time / 60).toFixed(0)}:${(end_time % 60).toFixed(0)},<br/> Confidence: ${confidence.toFixed(2)}, Cost: ${cost.toFixed(2)}`;
                // Insert in order
                const logContainer = document.getElementById('log');
                let inserted = false;
                for (let i = 0; i < logContainer.children.length; i++) {
                    const childId = parseInt(logContainer.children[i].id.replace('log-', ''));
                    if (id < childId) {
                        logContainer.insertBefore(newLogEntry, logContainer.children[i]);
                        inserted = true;
                        break;
                    }
                }
                if (!inserted) {
                    logContainer.appendChild(newLogEntry);
                }
                logEntries[id] = newLogEntry;
            }
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / (window.innerHeight * 0.7);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth * 0.66, window.innerHeight * 0.7);
        });

        // Watchdog to poll for new CSV lines
 async function watchCSV() {
    try {
        const response = await fetch('http://172.18.91.41:3000/new-lines');
        const newLines = await response.text();
        if (newLines.trim()) {
            const lines = newLines.trim().split('\n');
            lines.forEach(line => {
                let [time, x, y, z, cost, id, confidence, start_time, end_time, birdnet_id] = line.split(',');
                time = new Date(time * 1000); // Multiply by 1000 to convert back to milliseconds
                time = time.toLocaleString();
                start_time = start_time % 300
                end_time = end_time % 300

                if (!Number.isNaN(id) && (typeof id !== 'undefined')) {
                addDataPoint({
                    time, x: parseFloat(x), y: parseFloat(y), z: parseFloat(z),
                    cost: parseFloat(cost), id: parseInt(id), confidence: parseFloat(confidence),
                    start_time, end_time, birdnet_id
                });
            }
            });
        }
    } catch (err) {
        console.error("Error fetching new lines:", err);
    }
    setTimeout(watchCSV, 1000); // Poll every second
}

// Start watching the CSV file
watchCSV();

    </script>
</body>
</html>
